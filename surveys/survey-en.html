<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Service Satisfaction</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #f7f7f7; color: #222;
      min-height: 100vh; display: flex;
      align-items: flex-start; justify-content: center;
      padding: 2rem 1rem;
    }
    .card {
      background: #fff; border-radius: 16px; padding: 2rem;
      width: 100%; max-width: 480px;
      box-shadow: 0 2px 16px rgba(0,0,0,0.08);
    }
    .logo-area { text-align: center; margin-bottom: 1.5rem; }
    .logo-area h1 { font-size: 1.3rem; font-weight: 600; color: #111; }
    .logo-area p  { font-size: 0.9rem; color: #666; margin-top: 4px; }
    .warning {
      background: #fff8e1; border: 1px solid #f59e0b;
      border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.85rem; color: #92400e; margin-bottom: 1.5rem;
    }
    .question { margin-bottom: 1.75rem; }
    .question label {
      display: block; font-size: 0.95rem; font-weight: 500;
      margin-bottom: 0.6rem; color: #333;
    }
    .stars { display: flex; gap: 8px; }
    .stars span {
      font-size: 2rem; cursor: pointer; color: #ddd;
      transition: color 0.15s; line-height: 1; user-select: none;
    }
    .stars span.active { color: #f59e0b; }
    .stars span:hover  { color: #f59e0b; }
    textarea {
      width: 100%; padding: 10px 14px;
      border: 1px solid #ddd; border-radius: 8px;
      font-size: 0.95rem; font-family: inherit;
      resize: vertical; min-height: 90px;
      color: #333; background: #fafafa;
    }
    textarea:focus { outline: none; border-color: #999; background: #fff; }
    .meta-info {
      background: #f5f5f5; border-radius: 8px;
      padding: 0.6rem 1rem; font-size: 0.78rem;
      color: #888; margin-bottom: 1.5rem;
    }
    .btn {
      width: 100%; padding: 14px;
      background: #111; color: #fff; border: none;
      border-radius: 10px; font-size: 1rem; font-weight: 500;
      cursor: pointer; transition: background 0.2s;
    }
    .btn:hover   { background: #333; }
    .btn:active  { background: #000; }
    .btn:disabled { background: #ccc; cursor: not-allowed; }
    .error {
      background: #fee2e2; border: 1px solid #f87171;
      border-radius: 8px; padding: 0.75rem 1rem;
      font-size: 0.88rem; color: #991b1b; margin-top: 1rem;
    }
    .thankyou { text-align: center; padding: 2rem 0; display: none; }
    .thankyou .icon { font-size: 3rem; margin-bottom: 1rem; }
    .thankyou h2 { font-size: 1.3rem; font-weight: 600; margin-bottom: 0.5rem; }
    .thankyou p  { color: #666; font-size: 0.95rem; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo-area">
    <h1>How was your service?</h1>
    <p>Your feedback helps us improve.</p>
  </div>

  <div class="warning" id="warning" style="display:none">
    ⚠️ QR code may be invalid. Please contact your technician.
  </div>

  <form id="survey-form">
    <input type="hidden" name="unit"   id="unit">
    <input type="hidden" name="market" id="market">
    <input type="hidden" name="lang"   value="en">

    <div class="meta-info" id="meta-info"></div>

    <div class="question">
      <label>How satisfied were you overall?</label>
      <div class="stars" id="stars-q1" data-field="q1_overall">
        <span data-val="1">★</span><span data-val="2">★</span>
        <span data-val="3">★</span><span data-val="4">★</span>
        <span data-val="5">★</span>
      </div>
      <input type="hidden" name="q1_overall" id="q1_overall">
    </div>

    <div class="question">
      <label>Was the work completed on time?</label>
      <div class="stars" id="stars-q2" data-field="q2_timeliness">
        <span data-val="1">★</span><span data-val="2">★</span>
        <span data-val="3">★</span><span data-val="4">★</span>
        <span data-val="5">★</span>
      </div>
      <input type="hidden" name="q2_timeliness" id="q2_timeliness">
    </div>

    <div class="question">
      <label>Would you recommend our service?</label>
      <div class="stars" id="stars-q3" data-field="q3_recommend">
        <span data-val="1">★</span><span data-val="2">★</span>
        <span data-val="3">★</span><span data-val="4">★</span>
        <span data-val="5">★</span>
      </div>
      <input type="hidden" name="q3_recommend" id="q3_recommend">
    </div>

    <div class="question">
      <label>Additional comments (optional)</label>
      <textarea name="comments" id="comments" placeholder="Your feedback..."></textarea>
    </div>

    <button type="submit" class="btn" id="submit-btn">Submit rating</button>
    <div class="error" id="error-msg" style="display:none"></div>
  </form>

  <div class="thankyou" id="thankyou">
    <div class="icon">✓</div>
    <h2>Thank you!</h2>
    <p>Your rating has been submitted successfully.<br>We really appreciate your feedback.</p>
  </div>
</div>

<script>
  const params = new URLSearchParams(window.location.search);
  const unit   = params.get('unit')   || '';
  const market = params.get('market') || '';

  document.getElementById('unit').value   = unit;
  document.getElementById('market').value = market;

  if (!unit || !market) {
    document.getElementById('warning').style.display = 'block';
  }
  if (unit || market) {
    document.getElementById('meta-info').textContent =
      `Unit: ${unit || '?'} · Market: ${market || '?'}`;
  } else {
    document.getElementById('meta-info').style.display = 'none';
  }

  document.querySelectorAll('.stars').forEach(group => {
    const field = group.dataset.field;
    const spans = group.querySelectorAll('span');
    spans.forEach(span => {
      span.addEventListener('click', () => {
        const val = parseInt(span.dataset.val);
        document.getElementById(field).value = val;
        spans.forEach(s => s.classList.toggle('active', parseInt(s.dataset.val) <= val));
      });
    });
  });

  document.getElementById('survey-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const btn     = document.getElementById('submit-btn');
    const errorEl = document.getElementById('error-msg');
    errorEl.style.display = 'none';
    btn.disabled = true;
    btn.textContent = 'Submitting...';

    const payload = {
      unit:          document.getElementById('unit').value,
      market:        document.getElementById('market').value,
      lang:          'en',
      q1_overall:    document.getElementById('q1_overall').value    || null,
      q2_timeliness: document.getElementById('q2_timeliness').value || null,
      q3_recommend:  document.getElementById('q3_recommend').value  || null,
      comments:      document.getElementById('comments').value.trim() || null,
    };

    try {
      const res  = await fetch('/api/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(payload),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        document.getElementById('survey-form').style.display = 'none';
        document.getElementById('thankyou').style.display = 'block';
      } else {
        throw new Error(data.error || 'Unknown error');
      }
    } catch (err) {
      errorEl.textContent = 'Error: ' + err.message;
      errorEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Submit rating';
    }
  });
</script>
</body>
</html>
